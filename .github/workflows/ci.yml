name: CI

on:
  push:
    branches: [main]

jobs:
  test-go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install test tools
        run: |
          go install gotest.tools/gotestsum@latest
          go install github.com/mfridman/tparse@latest
      - name: Run tests
        run: |
          gotestsum --format short-verbose --jsonfile test-results.json \
            -- -count=1 -cover ./...
      - name: Write test summary
        if: always()
        run: tparse -all -format markdown -file test-results.json >> $GITHUB_STEP_SUMMARY

  test-ui:
    name: UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm test

  release:
    name: Build and release
    needs: [test-go, test-ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 CGO_CFLAGS="" make build

      - name: Package release archive
        run: |
          mkdir -p release
          cp bin/autowiki release/autowiki
          cp -r public/ release/public/
          tar -czf autowiki-linux-amd64.tar.gz -C release .

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true
          gh release create latest \
            --title "Latest ($(git rev-parse --short HEAD))" \
            --notes "Built from \`${{ github.sha }}\` on $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --prerelease \
            autowiki-linux-amd64.tar.gz
