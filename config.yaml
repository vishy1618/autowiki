vault_path: ${VAULT_PATH}
server_port: ${PORT}
base_url: ${BASE_URL}
anthropic_api_key: ${ANTHROPIC_API_KEY}
anthropic_base_url: ${ANTHROPIC_BASE_URL}
pebble_path: ${PEBBLE_PATH}
chat_model: ${CHAT_MODEL}
dream_model: ${DREAM_MODEL}
auth:
  google_client_id: ${GOOGLE_CLIENT_ID}
  google_client_secret: ${GOOGLE_CLIENT_SECRET}
  allowed_email: ${ALLOWED_EMAIL}
  session_secret: ${SESSION_SECRET}
dream:
  enabled: true
  start_hour_utc: 19
  end_hour_utc: 23
drive_sync:
  enabled: ${DRIVE_SYNC_ENABLED}
  root_folder_name: ${DRIVE_SYNC_ROOT_FOLDER}
  vault_folder_name: ${DRIVE_SYNC_VAULT_FOLDER}
  poll_interval_secs: ${DRIVE_SYNC_POLL_INTERVAL_SECS}
  conflict_strategy: ${DRIVE_SYNC_CONFLICT_STRATEGY}
